name: Actualizar cache de stats NFL

on:
  schedule:
    # Todos los martes 12:00 UTC (7am hora del este) — despues de que termina
    # el Monday Night Football, dandole tiempo a nflverse de actualizar sus
    # datos antes de que abra la siguiente semana (jueves).
    - cron: "0 12 * * 2"
  workflow_dispatch: {}  # permite correrlo a mano desde GitHub

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr actualizacion
        run: python scripts/update_cache.py

      - name: Commitear cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats_cache.json
          git diff --quiet --cached || git commit -m "Actualizar cache de stats NFL"
          git push
